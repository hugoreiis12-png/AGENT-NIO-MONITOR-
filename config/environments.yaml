# URLs e nomes de variavel de ambiente. SEGREDO NAO FICA AQUI -- so o nome da env.

environments:
  production:
    n8n:
      # Verificado por sonda TCP + HTTP: 192.168.0.140:5678 esta FECHADO.
      # O n8n responde em 192.168.0.160:5678 (/healthz -> 200).
      url: "http://192.168.0.160:5678"
      api_key_env: "N8N_API_KEY"
      verify_ssl: false
      timeout_seconds: 30
    portainer:
      # Verificado: o mesmo token devolve 401 em .140 e 200 em .160.
      # Ha mais de um Portainer na rede; este e o que responde.
      url: "https://192.168.0.160:9443"
      api_key_env: "PORTAINER_API_KEY"
      verify_ssl: false
      timeout_seconds: 30
    # Power Automate via Dataverse (service principal nio-fabric-sp, so leitura).
    # "URL do ambiente" do Power Platform admin center (credencial em POWERAUTOMATE_* no .env).
    powerautomate:
      dataverse_url: "https://org7dd46aa7.crm2.dynamics.com"

active_environment: production

# Cadencias distintas porque o custo e assimetrico (ADR D6).
# Medido na instancia real: GET /api/v1/workflows = 11,2 MB por pagina.
# A 60 s sao ~16 GB/dia de leitura (rede local) para descobrir que nada mudou -- custo
# aceito pelo dono para a edicao de workflow chegar em ate 1 min. O snapshot so e
# gravado quando ha mudanca, entao o banco nao cresce com isso.
polling:
  execution_errors_seconds: 30
  workflow_full_seconds: 60      # diff completo + ativacao/desativacao (uma leitura so)
  container_state_seconds: 30
  container_stats_seconds: 60
  stack_changes_seconds: 60
  queue_seconds: 10              # fila de disparo: reconfere e envia (nao le as fontes)
  queue_max_delay_seconds: 50    # alerta sai em ate 50 s depois de entrar na fila

# Canal normal: webhook do n8n (mesmo host da instancia monitorada).
# Canal de n8n morto: log no terminal (decisao do dono do projeto).
mail:
  webhook_url: "http://192.168.0.160:5678"
  webhook_path: "/webhook/agent-nio-monitor"
  # Arte do e-mail HTML (assets/email no repositorio, servida pelo GitHub).
  assets_base_url: "https://raw.githubusercontent.com/hugoreiis12-png/AGENT-NIO-MONITOR-/main/assets/email"
  support_email: "help@jfcagro.com.br"
  # Canal de reserva (D46): so usado quando o webhook acima falha. Usuario/senha vem do ambiente.
  smtp:
    host: "pop.grupocampanha.com.br"
    port: 465
    seguranca: ssl
    from_address: "nio@grupocampanha.com.br"

# O LLM ANALISA o erro e REDIGE o alerta. Nao decide severidade nem destinatario.
# Qwen no vLLM local (API compativel com OpenAI).
llm:
  base_url: "http://192.168.0.140:8001/v1"
  model: "RedHatAI/Qwen3.8-27B-INT4"
  timeout_seconds: 60
  temperature: 0.2
  max_tokens: 700
  fallback_to_template: true
  # Investigacao (ADR D42): antes de redigir, o Qwen chama ferramentas SO de leitura (log,
  # inspect, execucao, acoes do RPA) pelo tool calling Hermes do vLLM. Evidencia citada e
  # conferida literalmente; sem ela a confianca e 'baixa'. Falhou ou estourou o prazo: cai
  # na analise simples. Medido: 13-18 s por alerta.
  investigacao: true
  investigacao_max_passos: 4
  investigacao_prazo_segundos: 75

# Schema separado. NUNCA o mesmo database do n8n.
database:
  dsn: "${DATABASE_DSN}"
  schema: "hermes"
  pool_min: 1
  pool_max: 8
  # Retencao das tabelas particionadas (DROP PARTITION, irreversivel). null = guarda tudo.
  # Decisao do dono; o runbook sugere 90. Minimo aceito: 60.
  retention_days: null