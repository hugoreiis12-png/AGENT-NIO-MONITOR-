# Motor de regras UNICO.
#
# O doc original tinha DUAS fontes de verdade para "o que e risco":
# notification_rules.yaml (config) E um RiskAnalyzer hardcoded com `score += 4`.
# Config que discorda do codigo e como a config passa a mentir em silencio.
# Aqui existe so este arquivo.

aggregation:
  # Medido na instancia real: 25 erros em 25h35, 8 workflows distintos, com os 3
  # maiores = 76% deles.
  #
  # Deduplicar NAO e o que limita o volume aqui. O que limita e quantos workflows
  # DISTINTOS estao quebrados -- 8. Cada um precisa de pelo menos 1 alerta, senao
  # o monitor deixa de detectar. O piso e 8, nao 5.
  re_notify_after_minutes: 720
  # Workflow/credencial/stack so alerta depois de 10 min sem nova edicao: a sessao de
  # edicao inteira vira UM e-mail (medido: 7 e-mails de 'foi alterado' em 4 h).
  edicao_quieta_minutos: 10

quiet_hours:
  enabled: false
  timezone: "America/Sao_Paulo"
  start: "22:00"
  end: "08:00"
  critical_breaks_quiet_hours: true

max_recipients: 10

# O que e RELEVANTE o bastante para alertar (nao alerta abaixo disso).
thresholds:
  # Stack so alerta se o compose mudou mais que isso (0.20 = 20% das linhas).
  stack_change_ratio: 0.20
  # Loop de reinicio: N reinicios dentro da janela.
  restart_loop_count: 3
  restart_loop_window_minutes: 10
  # Alteracao de workflow com score de risco (0-10, diff.risco_para_score) ate este valor e
  # refactor: nao muda o resultado do fluxo (renomear no, mexer em versao, nota, posicao).
  # Vai como aviso VERDE (workflow_refactored). Acima disso, workflow_changed (amarelo).
  refactor_max_score: 1
  # Consumo: precisa ficar acima do limite por N coletas seguidas (coletas de 60 s).
  cpu_host_pct: 80      # % do CPU total do host usado pelo container
  mem_pct: 90           # % do limite de memoria do container
  sustained_samples: 5   # coletas de 60 s: ~5 min acima do limite

# Cruzamento de fontes (incidente MB de 28/10/2026): quando o log de container
# delata uma DEPENDENCIA do n8n, o agente consulta as execucoes dos workflows
# mapeados, anexa os fatos ao evento e, se a dependencia nao entregou, emite
# `dependency_silent`. Janela por EVIDENCIA na janela, nunca por cadencia: o
# poller roda em rajadas horarias, e frequencia baixa aqui e normal.
correlacoes:
  - # Pipeline de extracao do portal Martin Brower (roda na VM, log vai prox ao
    # container do Portainer). Marcadores vao do proprio log do incidente.
    automacao: ["mcd.?donalds", "mcdonalds"]
    marcadores:
      - "RESET_LINK_TIMEOUT"
      - "Ponte n8n viva"
      - "execuções do fluxo de trabalho"
    workflows:
      - name: "MB Email IMAP"
        id: D5TsMY8mOJj6gJ1L
      - name: "MB Event Broker"
        id: STfrlbTnTeuBDntf
    janela_min: 15

rules:
  # Falha repetida de workflow e o sinal de maior valor: os horarios observados
  # sao deterministicos, ou seja, sao jobs agendados quebrados, nao incidentes.
  # Janela de re-notificacao de 12h: um critico que ja escalou tem escada de
  # escalacao, nao precisa repetir a cada 4h -- repetir treina o time a ignorar.
  - name: "workflow_falhando_repetidamente"
    event_types: ["execution_failed"]
    severity: critical
    min_streak: 3
    notify: true
    escalate_after_minutes: [15, 45]   # INERTE: escalacao nao ligada (ADR D24)
    template: "workflow_failing"
    re_notify_after_minutes: 720

  # Falha isolada: avisa UMA vez. A urgencia e tratada pela escada de escalacao
  # (15/45 min), nao por repetir email. Um workflow que falha a noite e de novo
  # de manha e o MESMO incidente -- dois emails seria ruido, nao informacao.
  - name: "workflow_falhou_uma_vez"
    event_types: ["execution_failed"]
    severity: high
    min_streak: 1
    notify: true
    template: "execution_failed"
    re_notify_after_minutes: 720

  # RPA (fluxo de desktop do Power Automate). Mesma escada do n8n: 3 falhas seguidas
  # do mesmo fluxo e critico; 1 avisa uma vez. Medido em 14/10/2026: um fluxo de hora em
  # hora falhando desde 01/10 (WindowsIdentityIncorrect) -- ~319 falhas sem aviso.
  - name: "rpa_falhando_repetidamente"
    event_types: ["desktop_flow_failed"]
    severity: critical
    min_streak: 3
    notify: true
    template: "desktop_flow_failing"
    re_notify_after_minutes: 720

  - name: "rpa_falhou_uma_vez"
    event_types: ["desktop_flow_failed"]
    severity: high
    min_streak: 1
    notify: true
    template: "desktop_flow_failed"
    re_notify_after_minutes: 720

  - name: "workflow_desativado"
    event_types: ["workflow_deactivated"]
    severity: high
    notify: true
    template: "workflow_deactivated"

  - name: "workflow_alterado_em_producao"
    event_types: ["workflow_changed"]
    severity: medium
    notify: true
    template: "workflow_changed"

  - name: "credencial_alterada"
    event_types: ["credential_updated"]
    severity: high
    notify: true
    template: "credential_updated"

  - name: "container_indisponivel"
    event_types: ["container_stopped", "container_unhealthy"]
    severity: critical
    notify: true
    escalate_after_minutes: [5]        # INERTE: escalacao nao ligada (ADR D24)
    template: "container_down"

  - name: "stack_alterada"
    event_types: ["stack_changed"]
    severity: high
    notify: true
    template: "stack_changed"

  - name: "container_removido"
    event_types: ["container_removed"]
    severity: high
    notify: true
    template: "container_removed"

  - name: "consumo_alto"
    event_types: ["container_resource_high"]
    severity: high
    notify: true
    template: "container_resource_high"

  # Criacao e aviso VERDE (severidade baixa = tema verde do e-mail): registro, nao incidente.
  - name: "workflow_criado"
    event_types: ["workflow_created"]
    severity: low
    notify: true
    template: "workflow_created"

  - name: "restart_loop"
    event_types: ["container_restart_loop"]
    severity: high
    notify: true
    template: "restart_loop"

  # Falha do proprio monitor: silencio e o pior modo de falha de um monitor.
  - name: "coleta_com_buraco"
    event_types: ["reconciliation_gap"]
    severity: critical
    notify: true
    template: "reconciliation_gap"

  # Ponte quebrou SEM falha visivel: a automacao pagou a espera do seu timeout e
  # a dependencia n8n nao entregou (nao rodou, errou ou respondeu vazio). Verdade
  # encontrada pelo cruzamento de fontes -- n8n "verde" nunca mais esconde isso.
  - name: "dependencia_muda"
    event_types: ["dependency_silent"]
    severity: high
    notify: true
    template: "dependency_silent"
    re_notify_after_minutes: 720

  - name: "n8n_indisponivel"
    event_types: ["source_down"]
    severity: critical
    notify: false          # n8n fora do ar => vai para log, nao por email
    template: "source_down"

  - name: "workflow_ativado"
    event_types: ["workflow_activated"]
    severity: low
    notify: true
    template: "workflow_activated"
  # --- Coleta profunda (ADR D39-D41) -------------------------------------------
  # Execucao VERDE com no em erro (continueOnFail / onError: continue).
  - name: "erro_escondido_em_execucao"
    event_types: ["node_error_hidden"]
    severity: high
    notify: true
    template: "node_error_hidden"
    re_notify_after_minutes: 720

  # Etapa do caminho normal (roda em >=95% das ultimas 50 execucoes) que nao rodou.
  - name: "etapa_do_fluxo_nao_rodou"
    event_types: ["node_not_executed"]
    severity: medium
    notify: true
    template: "node_not_executed"
    re_notify_after_minutes: 720

  # Gatilho do n8n falhando (lido no log do container). 3 na ultima hora: abaixo
  # disso e reconexao normal de IMAP, nao incidente.
  - name: "gatilho_falhando"
    event_types: ["workflow_trigger_failed"]
    severity: high
    min_streak: 3
    notify: true
    template: "workflow_trigger_failed"
    re_notify_after_minutes: 720

  # Mensagem de erro NOVA no log de um container, ou pico de uma conhecida.
  - name: "erro_no_log_do_container"
    event_types: ["container_log_error"]
    severity: medium
    notify: true
    template: "container_log_error"
    re_notify_after_minutes: 720

  # RPA verde com acao que falhou dentro de tratamento de erro.
  - name: "rpa_com_erros_tratados"
    event_types: ["desktop_flow_handled_errors"]
    severity: medium
    notify: true
    template: "desktop_flow_handled_errors"
    re_notify_after_minutes: 720

  # --- Avisos verdes (criacao e refactor) ------------------------------------------
  - name: "workflow_reorganizado"
    event_types: ["workflow_refactored"]
    severity: low
    notify: true
    template: "workflow_refactored"

  - name: "container_criado"
    event_types: ["container_created"]
    severity: low
    notify: true
    template: "container_created"

  - name: "fluxo_rpa_criado"
    event_types: ["desktop_flow_created"]
    severity: low
    notify: true
    template: "desktop_flow_created"

  # --- App Bubble (comprover) -------------------------------------------------------
  - name: "bubble_erro_novo"
    event_types: ["bubble_error_new"]
    severity: medium
    notify: true
    template: "generic"
    re_notify_after_minutes: 720

  - name: "bubble_workflow_5xx"
    event_types: ["bubble_workflow_5xx"]
    severity: high
    notify: true
    template: "generic"
    re_notify_after_minutes: 60

  - name: "bubble_schema_mudou"
    event_types: ["bubble_schema_changed"]
    severity: low
    notify: true
    template: "generic"
    re_notify_after_minutes: 720

  - name: "bubble_api_indisponivel"
    event_types: ["bubble_api_unreachable"]
    severity: high
    notify: true
    template: "generic"
    re_notify_after_minutes: 10

# Leitura dos logs dos containers (ADR D40). A primeira leitura de cada container
# so aprende as mensagens que ja existem; alerta e para mensagem NOVA ou pico.
logs:
  max_containers_por_ciclo: 12   # rodizio: 35 containers lidos a cada ~90 s
  pico_minimo: 20                # pico precisa de pelo menos 20 linhas na leitura...
  fator_de_pico: 5.0             # ...e 5x a media daquela mensagem
  container_n8n: "n8n"           # de onde sai a falha de gatilho
  # Regex por container (ou "*" para todos). Telemetria do n8n (PostHog) sem rede nao e incidente
  # (visto na passada a seco de 19/10/2026).
  ignorar:
    n8n: ["PostHog"]
