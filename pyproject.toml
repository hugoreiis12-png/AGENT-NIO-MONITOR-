[project]
name = "agent-nio-monitor"
version = "0.1.0"
description = "Agente que observa n8n e Portainer, detecta falha e mudanca, e notifica o responsavel certo."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "apscheduler>=3.10",
    "structlog>=24.1",
    "tenacity>=9.0",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "aiohttp>=3.9",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pglast>=7.0",
    "respx>=0.21",
    "ruff>=0.6",
    "psycopg[binary,pool]>=3.2",
]

[project.scripts]
agent-nio-monitor = "agent_nio_monitor.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_nio_monitor"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: exige Postgres e credenciais reais (pulado por padrao)",
]

[tool.coverage.run]
source = ["src/agent_nio_monitor"]

[tool.ruff]
line-length = 100
target-version = "py312"